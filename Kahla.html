#ctl>*{pointer-events:auto}
#wh{width:128px;height:128px;touch-action:none}
#gc{display:flex;flex-direction:column;gap:6px}
#pd{display:flex;gap:10px;align-items:flex-end}
.p{border:0;border-radius:18px;font-weight:900;font-size:15px;touch-action:none}
.p.g{width:80px;height:130px;background:#2fa86a}.p.b{width:72px;height:90px;background:#d44a3a}

.code{display:flex;gap:8px;justify-content:center}
#ci{font:inherit;width:140px;padding:8px 12px;border-radius:999px;border:2px solid #fff6;background:#0004;color:var(--ink);text-align:center}
#cb,#go,#md button{font-weight:900;border:0;border-radius:999px;background:var(--sun);color:#2a1740;padding:8px 22px;cursor:pointer}
#cm{min-height:22px;font-size:14px}
#ji,#ci{user-select:text;-webkit-user-select:text}#ji{font:inherit;width:110px;padding:8px 12px;border-radius:999px;border:2px solid #fff6;background:#0004;color:var(--ink);text-align:center}#hb,#jb{font-weight:900;border:0;border-radius:999px;background:#fff3;color:var(--ink);padding:8px 16px;cursor:pointer}

#md{display:flex;gap:8px;justify-content:center;margin:10px 0}#md button{background:#fff3;color:var(--ink)}#md .on{background:var(--sun);color:#2a1740}
#gar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
.cd{display:flex;flex-direction:column;gap:2px;background:#fff2;border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;font-size:13px}
.cd b{font-size:15px}.cd.on{border-color:var(--sun)}.cd.lk{opacity:.5}
#go{font-size:22px;padding:12px 44px}
#rot{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:var(--g);border-radius:12px;padding:6px 14px;font-size:13px;white-space:nowrap}

@media (orientation:landscape){#gar{grid-template-columns:repeat(3,1fr)}h1{font-size:34px}}

#rot{top:calc(env(safe-area-inset-top,0px) + 180px)}

#zn,#mn{font-size:11px;line-height:1.3;margin-top:2px}
#top{right:max(12px,env(safe-area-inset-right));flex-wrap:nowrap;max-width:none;gap:6px}
#top button{padding:6px 10px;font-size:12px;border-radius:10px}
#ms,#ar{position:fixed;left:50%;transform:translateX(-50%);background:var(--g);border-radius:999px;direction:rtl;pointer-events:none;white-space:nowrap;margin:0}
#ms{top:calc(env(safe-area-inset-top,0px) + 8px);padding:4px 14px;font-size:13px;font-weight:600}

#ar{top:calc(env(safe-area-inset-top,0px) + 40px);padding:3px 12px 3px 8px}
#ar svg{width:22px;height:22px}#ad{font-size:12px}
#ctl{padding:0 max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));justify-content:flex-start;gap:10px}
#gc{margin-left:auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
#gc button{min-width:46px;height:46px;padding:0;font-size:15px}
.p:active{transform:scale(.95);filter:brightness(1.2)}
.p.g{width:78px;height:124px}.p.b{width:72px;height:88px}
#rot{top:calc(env(safe-area-inset-top,0px) + 76px)}

</style>
</head>
